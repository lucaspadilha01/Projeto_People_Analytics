<!doctype html><html><head><meta charset="utf-8"><title>Data</title>
<link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root" style="padding:16px 20px"></div>
<script type="text/babel">
const { DonutGauge, StatTile, ProgressBar, BarChart, LineChart, ChartLegend, PhaseTracker, ActivityHeatmap, GanttChart, MiniStatCell, WorkStatusBars, BudgetSplitLegend, Card } = window.NexaFlowDesignSystem_fd0681;
function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'grid',gridTemplateColumns:'190px 1fr 1fr',gap:12,alignItems:'start'}}>
      <Card title="Budget Overview">
        <div style={{display:'flex',justifyContent:'center'}}><DonutGauge value={73} sublabel="Allocated" size={118}/></div>
        <BudgetSplitLegend items={[{label:'Civil',percent:35},{label:'MEP',percent:25,color:'var(--series-2)'},{label:'Interiors',percent:28,color:'var(--series-3)'},{label:'Contingency',percent:12,color:'var(--series-4)'}]}/>
      </Card>
      <Card title="Project Performance Analytics" meta="Task completion, timeline, and budget tracking">
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          <StatTile label="On schedule" value="92%" delta="+5%"/>
          <StatTile label="Tasks Completed" value="156" delta="+12%"/>
          <StatTile label="Budget Variance" value="-3%" delta="±2%" direction="down"/>
        </div>
        <BarChart height={92} stacked yTicks={['100','75','50','25','0']} data={[['Jan',18,8,5],['Feb',24,9,6],['Mar',30,10,7],['Apr',36,11,7],['May',44,12,8],['Jun',52,13,8],['Jul',60,14,9]].map(([label,a,b,c])=>({label,values:[a,b,c]}))}/>
      </Card>
      <Card title="Monthly Cashflow">

    </div>
    <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1fr',gap:12,alignItems:'start'}}>
      <Card title="Timeline Gantt Chart">
        <GanttChart months={['Jan','Feb','Mar','Apr','May','Jun']} rows={[
          {label:'Concept Design',start:0,span:1,status:'completed'},
          {label:'Material Selection',start:1.4,span:1.6,status:'completed'},
          {label:'Working Drawing',start:2.6,span:1.2,status:'ontrack',percent:75},
          {label:'Furniture Layout',start:3.6,span:1,status:'delayed',percent:45},
          {label:'Execution Phase',start:4.6,span:1.2,status:'pending'}]}

        <WorkStatusBars done={0.45} inProgress={0.3}/>
        <ChartLegend align="flex-start" items={[{label:'Total'},{label:'Done',color:'var(--series-2)'},{label:'In progress',color:'var(--series-4)'}]}/>
      </Card>
    </div>
  </div>;

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
