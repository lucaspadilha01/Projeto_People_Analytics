<!-- @dsCard group="Brand" viewport="700x290" name="Logo sizing" subtitle="Lockup clears 56px and up; below that, switch to the bars-only mark" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--accent-strong)}.spec{display:flex;flex-direction:column;align-items:flex-start;gap:8px}.cap{font:var(--text-micro);font-weight:400;color:var(--text-muted)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Logo } = window.NexaFlowDesignSystem_fd0681;
function Demo(){
  return <div style={{padding:'18px 24px',display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',alignItems:'flex-end',gap:28,flexWrap:'wrap'}}>
      <span className="spec"><Logo height={96}/><span className="cap">96px · covers, collateral</span></span>
      <span className="spec"><Logo height={56}/><span className="cap"><strong style={{color:'var(--status-ok)'}}>56px minimum</strong> · rail, headers</span></span>
      <span className="spec"><Logo variant="mark" height={30}/><span className="cap">mark 30px · compact chrome</span></span>
      <span className="spec"><Logo variant="mark" height={16}/><span className="cap"><strong style={{color:'var(--status-ok)'}}>mark 16px min</strong> · favicon</span></span>
      <span className="spec"><Logo height={24}/><span className="cap"><strong style={{color:'var(--status-risk)'}}>Don't — 24px</strong> · sub-line falls to 4px</span></span>
    </div>
    <p style={{margin:0,font:'var(--text-caption)',fontFamily:'var(--font-sans)',color:'var(--text-muted)',maxWidth:620}}>
      "ANALYTICS" is the constraint — it sits at ~16% of the lockup height, so 56px puts it at 9px. Anywhere smaller, use <code>variant="mark"</code>. Clear space equals the height of the "HR" cap on all four sides.
    </p>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
