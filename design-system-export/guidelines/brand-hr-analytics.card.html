</head><body><div id="root"></div>
<script type="text/babel">
const { Logo } = window.NexaFlowDesignSystem_fd0681;
function Demo(){
  return <div style={{padding:'18px 24px'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
      <div><div className="tile" style={{background:'var(--surface-card)',border:'1px solid var(--border-hairline)'}}><Logo height={62}/></div><div className="cap">Primary · on white</div></div>
      <div><div className="tile" style={{background:'var(--surface-accent)'}}><Logo variant="reversed" height={62}/></div><div className="cap">Reversed · on violet</div></div>

      <div><div className="tile" style={{background:'var(--surface-card)',border:'1px solid var(--border-hairline)'}}><Logo variant="mark" height={44}/></div><div className="cap">Bar mark</div></div>
