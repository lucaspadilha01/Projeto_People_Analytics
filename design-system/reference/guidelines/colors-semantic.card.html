<!-- @dsCard group="Colors" viewport="700x160" name="Status colours" subtitle="On-track green, delay amber, variance red, info blue — fill + ink pairs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--accent-strong)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 24px">
<div style="background:var(--status-ok-bg);border-radius:8px;padding:12px"><div style="width:24px;height:24px;border-radius:999px;background:var(--status-ok)"></div><div style="font:var(--text-label);color:var(--status-ok);margin-top:10px">On-track</div><div style="font:var(--text-micro);font-weight:400;color:var(--text-muted)">--status-ok</div></div><div style="background:var(--status-warn-bg);border-radius:8px;padding:12px"><div style="width:24px;height:24px;border-radius:999px;background:var(--status-warn)"></div><div style="font:var(--text-label);color:var(--status-warn);margin-top:10px">Delayed</div><div style="font:var(--text-micro);font-weight:400;color:var(--text-muted)">--status-warn</div></div><div style="background:var(--status-risk-bg);border-radius:8px;padding:12px"><div style="width:24px;height:24px;border-radius:999px;background:var(--status-risk)"></div><div style="font:var(--text-label);color:var(--status-risk);margin-top:10px">Variance</div><div style="font:var(--text-micro);font-weight:400;color:var(--text-muted)">--status-risk</div></div><div style="background:var(--status-info-bg);border-radius:8px;padding:12px"><div style="width:24px;height:24px;border-radius:999px;background:var(--status-info)"></div><div style="font:var(--text-label);color:var(--status-info);margin-top:10px">Info</div><div style="font:var(--text-micro);font-weight:400;color:var(--text-muted)">--status-info</div></div>
</div></body></html>
